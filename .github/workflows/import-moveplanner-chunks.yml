name: Import MovePlanner source from chunks

on:
  push:
    paths:
      - moveplanner-source.tar.gz.b64.part-*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble and extract source archive
        run: |
          ls -1 moveplanner-source.tar.gz.b64.part-* | sort | xargs cat > moveplanner-source.tar.gz.b64
          base64 -d moveplanner-source.tar.gz.b64 > moveplanner-source.tar.gz
          tar -xzf moveplanner-source.tar.gz
          rm -f moveplanner-source.tar.gz moveplanner-source.tar.gz.b64 moveplanner-source.tar.gz.b64.part-*

      - name: Commit imported project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import MovePlanner 2.0 source"
            git push
          fi
